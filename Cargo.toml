[package]
name = "clock"
version = "0.1.0"
rust-version = "1.98"
edition = "2024"
license = "GPL-3.0-only"
description = "A polished world clock, alarm, timer, and stopwatch for COSMIC"
homepage = "https://cosmic-utils.org"
repository = "https://github.com/cosmic-utils/cosmic-ext-clock"
authors = ["Frederic Laing <frederic.laing.development@gmail.com>"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.0"
iana-time-zone = "0.1.65"
icu_calendar = { version = "2.2.0", default-features = false, features = ["compiled_data"] }
icu_locale = { version = "2.2.0", default-features = false }
open = "5.3.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
notify-rust = "4.18.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["a11y", "about", "dbus-config", "tokio", "winit", "wayland", "x11", "wgpu"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = false
debug = 1

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
debug = 0
opt-level = 1
